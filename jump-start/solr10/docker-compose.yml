services:
  solr10:
    image: solr:10
    ports:
      - "8983:8983"
    volumes:
      - ./cloud-config-set:/opt/solr/server/solr/configsets/drupal/conf
    environment:
      SOLR_MODULES: "extraction,langid,ltr,analysis-extras"
    command: bash -c "docker-entrypoint.sh solr start; solr create -c drupal -d server/solr/configsets/drupal/conf -n drupal; solr restart -f"
